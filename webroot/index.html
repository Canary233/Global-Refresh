<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>全局高刷</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f7fb; --panel: #ffffff; --ink: #152033; --muted: #64748b; --line: #dbe3ee; --accent: #0f766e; --accent-ink: #ffffff; --soft: #e6f4f1; --focus: #0b5cab; --danger: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #10161e; --panel: #18212d; --ink: #edf4fb; --muted: #9aabba; --line: #2d3a49; --accent: #43c7b3; --accent-ink: #062c28; --soft: #1d3937; --focus: #8cc8ff; --danger: #ffb4ab; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width: min(720px, 100%); margin: 0 auto; padding: 24px 18px 32px; }
    header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: 27px; letter-spacing: 0; }
    .status { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat, section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    .stat { padding: 14px 16px; }
    .label { color: var(--muted); font-size: 13px; }
    .value { margin-top: 3px; font-size: 22px; font-weight: 650; }
    section { margin-top: 16px; padding: 18px; }
    section[hidden] { display: none; }
    .section-title { margin: 0 0 14px; font-size: 17px; }
    label { display: block; font-weight: 600; margin-bottom: 7px; }
    select, input[type="search"] { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); padding: 0 12px; font: inherit; }
    select:focus, input:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .mode-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .mode-copy { font-weight: 650; }
    .switch { display: inline-flex; flex: 0 0 auto; margin: 0; }
    .switch input { appearance: none; width: 48px; height: 28px; margin: 0; border: 1px solid var(--line); border-radius: 999px; background: var(--muted); cursor: pointer; position: relative; transition: background .15s ease; }
    .switch input::after { content: ""; position: absolute; width: 20px; height: 20px; top: 3px; left: 3px; border-radius: 50%; background: var(--panel); transition: transform .15s ease; }
    .switch input:checked { border-color: var(--accent); background: var(--accent); }
    .switch input:checked::after { transform: translateX(20px); }
    .switch input:disabled { cursor: wait; opacity: .6; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 17px; }
    button { min-height: 42px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); padding: 0 16px; font: inherit; font-weight: 600; }
    button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    button:disabled, select:disabled, input:disabled { opacity: .55; }
    #message { min-height: 24px; margin: 14px 2px 0; color: var(--muted); }
    #message.error { color: var(--danger); }
    .rates, .selection-count { margin-top: 14px; color: var(--muted); font-size: 13px; }
    .app-list { max-height: 420px; overflow: auto; margin-top: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .app-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 116px; align-items: center; gap: 10px; min-height: 64px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
    .app-row:last-child { border-bottom: 0; }
    .app-row.selected { background: var(--soft); }
    .app-row input { width: 19px; height: 19px; margin: 0; accent-color: var(--accent); }
    .app-copy { min-width: 0; }
    .app-name, .app-package { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-name { display: block; font-weight: 600; }
    .app-package { display: block; color: var(--muted); font-size: 12px; }
    .app-rate { min-height: 38px; padding: 0 8px; font-size: 13px; }
    .empty { padding: 18px 4px; color: var(--muted); }
    @media (max-width: 430px) { main { padding: 18px 14px 26px; } .status { gap: 8px; } .stat { padding: 12px; } .value { font-size: 19px; } .actions { justify-content: stretch; } button { flex: 1; } .app-row { grid-template-columns: 24px minmax(0, 1fr) 96px; gap: 8px; } .app-rate { padding: 0 5px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>全局高刷</h1></header>
    <div class="status">
      <div class="stat"><div class="label">当前刷新率</div><div id="current" class="value">--</div></div>
      <div class="stat"><div class="label">最高档位</div><div id="auto" class="value">--</div></div>
    </div>
    <section>
      <h2 class="section-title">全局高刷</h2>
      <div class="mode-row">
        <span class="mode-copy">全局锁定</span>
        <label class="switch"><input id="global-enabled" type="checkbox" role="switch" aria-label="全局锁定" disabled></label>
      </div>
      <label for="rate">目标档位</label>
      <select id="rate" disabled></select>
      <div class="actions"><button id="reload" type="button">重新读取</button><button id="save-global" class="primary" type="button" disabled>保存全局设置</button></div>
      <div id="rates" class="rates"></div>
    </section>
    <section id="apps-section" hidden>
      <h2 class="section-title">应用刷新率</h2>
      <label for="app-search">搜索应用</label>
      <input id="app-search" type="search" autocomplete="off" placeholder="输入应用名称或包名" disabled>
      <div id="selection-count" class="selection-count"></div>
      <div id="app-list" class="app-list" aria-live="polite"></div>
      <div class="actions"><button id="save-apps" class="primary" type="button" disabled>保存应用设置</button></div>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script>
    const info = JSON.parse(window.ksu.moduleInfo());
    const moduleDir = info.moduleDir;
    const script = moduleDir + '/refresh-webui.sh';
    const quote = value => "'" + String(value).replace(/'/g, "'\\''") + "'";
    let commandSequence = 0;
    const run = (...args) => new Promise((resolve, reject) => {
      const callbackName = '__globalRefreshExec' + (++commandSequence);
      const command = ['/system/bin/sh', script, ...args].map(quote).join(' ');
      const timeout = window.setTimeout(() => {
        delete window[callbackName];
        reject(new Error('KernelSU 命令执行超时'));
      }, 15000);
      window[callbackName] = (errno, stdout, stderr) => {
        window.clearTimeout(timeout);
        delete window[callbackName];
        if (Number(errno) !== 0) {
          reject(new Error(String(stderr || stdout || ('命令执行失败（' + errno + '）')).trim()));
          return;
        }
        resolve(String(stdout == null ? '' : stdout));
      };
      try { window.ksu.exec(command, JSON.stringify({}), callbackName); }
      catch (error) { window.clearTimeout(timeout); delete window[callbackName]; reject(error); }
    });

    const els = {
      rate: document.getElementById('rate'), current: document.getElementById('current'), auto: document.getElementById('auto'), rates: document.getElementById('rates'), message: document.getElementById('message'), reload: document.getElementById('reload'), globalEnabled: document.getElementById('global-enabled'), saveGlobal: document.getElementById('save-global'), appsSection: document.getElementById('apps-section'), search: document.getElementById('app-search'), list: document.getElementById('app-list'), count: document.getElementById('selection-count'), saveApps: document.getElementById('save-apps')
    };
    const appState = { all: [], rates: new Map() };
    const state = { globalEnabled: false, ready: false, rates: [], auto: '' };
    let loadSequence = 0;
    let appsLoaded = false;
    const parse = text => Object.fromEntries(String(text).trim().split(/\r?\n/).filter(line => line.includes('=')).map(line => { const i = line.indexOf('='); return [line.slice(0, i), line.slice(i + 1)]; }));
    const show = (text, error = false) => { els.message.textContent = text; els.message.className = error ? 'error' : ''; };
    const shortName = packageName => packageName.split('.').pop() || packageName;
    const configuredRateMap = text => new Map(String(text || '').split(',').map(record => record.split('=')).filter(([packageName, rate]) => packageName && rate).map(([packageName, rate]) => [packageName, rate]));
    const parseApps = text => {
      const lines = String(text).trim().split(/\r?\n/);
      const configured = (lines.find(line => line.startsWith('configured_rates=')) || '').slice('configured_rates='.length);
      const apps = lines.filter(line => line.startsWith('app=')).map(line => {
        const fields = line.slice(4).split('\t');
        const packageName = fields[0] || '';
        return { packageName, label: fields[1] || shortName(packageName), rate: fields[2] || '' };
      }).filter(app => app.packageName);
      return { configured, apps };
    };

    function addRateOptions(select, selectedRate = 'auto') {
      const auto = document.createElement('option');
      auto.value = 'auto';
      auto.textContent = '自动（' + state.auto + 'Hz）';
      select.append(auto);
      for (const rate of state.rates) {
        const option = document.createElement('option');
        option.value = rate;
        option.textContent = rate + 'Hz';
        select.append(option);
      }
      select.value = state.rates.includes(String(selectedRate)) || selectedRate === 'auto' ? selectedRate : 'auto';
    }

    function updateSelectionCount() {
      const count = appState.rates.size;
      els.count.textContent = count ? '已配置 ' + count + ' 个应用' : '未配置应用';
    }

    function renderApps() {
      const query = els.search.value.trim().toLowerCase();
      const apps = appState.all.filter(app => app.packageName.toLowerCase().includes(query) || app.label.toLowerCase().includes(query)).sort((left, right) => {
        const selectionDifference = Number(appState.rates.has(right.packageName)) - Number(appState.rates.has(left.packageName));
        if (selectionDifference) return selectionDifference;
        return left.label.localeCompare(right.label, 'zh-Hans-CN') || left.packageName.localeCompare(right.packageName);
      });
      els.list.replaceChildren();
      if (!apps.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '未找到应用';
        els.list.append(empty);
      }
      for (const app of apps) {
        const packageName = app.packageName;
        const selected = appState.rates.has(packageName);
        const row = document.createElement('div');
        row.className = 'app-row' + (selected ? ' selected' : '');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = selected;
        checkbox.setAttribute('aria-label', '配置 ' + app.label);
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) appState.rates.set(packageName, app.rate || 'auto');
          else appState.rates.delete(packageName);
          renderApps();
        });
        const copy = document.createElement('span');
        copy.className = 'app-copy';
        const name = document.createElement('span');
        name.className = 'app-name';
        name.textContent = app.label;
        const packageText = document.createElement('span');
        packageText.className = 'app-package';
        packageText.textContent = packageName;
        copy.append(name, packageText);
        const rate = document.createElement('select');
        rate.className = 'app-rate';
        rate.disabled = !selected;
        rate.setAttribute('aria-label', app.label + ' 的刷新率');
        addRateOptions(rate, appState.rates.get(packageName) || app.rate || 'auto');
        rate.addEventListener('change', () => appState.rates.set(packageName, rate.value));
        row.append(checkbox, copy, rate);
        els.list.append(row);
      }
      updateSelectionCount();
    }

    function syncMode() {
      const enabled = state.globalEnabled;
      els.globalEnabled.checked = enabled;
      els.appsSection.hidden = enabled;
      els.rate.disabled = !state.ready || !enabled;
      els.saveGlobal.disabled = !state.ready || !enabled;
      els.search.disabled = !state.ready || enabled || !appsLoaded;
      els.saveApps.disabled = !state.ready || enabled || !appsLoaded;
    }

    function updateCurrent(result) {
      if (result.current) els.current.textContent = result.current === 'unknown' ? '--' : result.current + 'Hz';
    }

    async function loadApps(sequence) {
      appsLoaded = false;
      syncMode();
      els.list.replaceChildren();
      const loading = document.createElement('div');
      loading.className = 'empty';
      loading.textContent = '正在加载应用列表…';
      els.list.append(loading);
      try {
        const apps = parseApps(await run('apps'));
        if (sequence !== loadSequence || state.globalEnabled) return;
        appState.rates = configuredRateMap(apps.configured);
        appState.all = [...new Map(apps.apps.map(app => [app.packageName, app])).values()];
        appsLoaded = true;
        renderApps();
        syncMode();
        show('已读取');
      } catch (error) {
        if (sequence !== loadSequence) return;
        els.list.replaceChildren();
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '应用列表读取失败';
        els.list.append(empty);
        show(error.message || '读取失败', true);
      }
    }

    async function load() {
      const sequence = ++loadSequence;
      state.ready = false;
      appsLoaded = false;
      els.reload.disabled = true;
      syncMode();
      show('读取刷新率…');
      try {
        const result = parse(await run('status'));
        if (result.error) throw new Error(result.error);
        if (sequence !== loadSequence) return;
        state.rates = String(result.rates || '').split(' ').filter(Boolean);
        state.auto = result.auto || '';
        state.globalEnabled = result.global_enabled === 'true';
        els.rate.replaceChildren();
        addRateOptions(els.rate, result.selected || 'auto');
        els.current.textContent = result.current === 'unknown' ? '--' : result.current + 'Hz';
        els.auto.textContent = state.auto + 'Hz';
        els.rates.textContent = '系统档位：' + state.rates.join(' / ') + 'Hz';
        state.ready = true;
        syncMode();
        if (state.globalEnabled) show('已开启全局锁定');
        else await loadApps(sequence);
      } catch (error) {
        if (sequence !== loadSequence) return;
        show(error.message || '读取失败', true);
      } finally {
        if (sequence === loadSequence) els.reload.disabled = false;
      }
    }

    async function saveGlobal() {
      const previous = state.globalEnabled;
      const enabled = els.globalEnabled.checked;
      els.globalEnabled.disabled = true;
      els.saveGlobal.disabled = true;
      els.reload.disabled = true;
      show(enabled ? '正在开启全局锁定…' : '正在关闭全局锁定…');
      try {
        const result = parse(await run('setglobal', enabled ? 'true' : 'false', els.rate.value || 'auto'));
        if (result.error || result.ok !== '1') throw new Error(result.error || '保存失败');
        state.globalEnabled = result.global_enabled === 'true';
        updateCurrent(result);
        syncMode();
        show(result.message || '已保存');
        if (previous && !state.globalEnabled) await loadApps(loadSequence);
      } catch (error) {
        state.globalEnabled = previous;
        els.globalEnabled.checked = previous;
        syncMode();
        show(error.message || '保存失败', true);
      } finally {
        els.globalEnabled.disabled = false;
        els.reload.disabled = false;
        syncMode();
      }
    }

    async function saveApps() {
      const records = [...appState.rates.entries()].sort(([left], [right]) => left.localeCompare(right)).map(([packageName, rate]) => packageName + '=' + rate).join(',');
      els.saveApps.disabled = true;
      els.reload.disabled = true;
      show('保存中…');
      try {
        const result = parse(await run('setapps', records));
        if (result.error || result.ok !== '1') throw new Error(result.error || '保存失败');
        updateCurrent(result);
        show(result.locked === '1' ? '已保存并应用当前应用设置' : '已保存');
      } catch (error) { show(error.message || '保存失败', true); }
      finally { els.reload.disabled = false; syncMode(); }
    }

    els.reload.addEventListener('click', load);
    els.saveGlobal.addEventListener('click', saveGlobal);
    els.globalEnabled.addEventListener('change', saveGlobal);
    els.saveApps.addEventListener('click', saveApps);
    els.search.addEventListener('input', renderApps);
    load();
  </script>
</body>
</html>
